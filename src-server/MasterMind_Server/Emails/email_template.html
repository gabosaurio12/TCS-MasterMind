<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encrypted Transmission - Verification Code</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 24px 12px;
      background-color: #121412;
      font-family: 'Courier Prime', 'Courier New', Courier, monospace;
      color: #e6dec8;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      max-width: 600px;
      margin: 0 auto;
    }

    .enigma-chassis {
      background-color: #3d4537;
      background-image: 
        radial-gradient(circle at 18% 22%, rgba(110, 56, 28, 0.28) 0%, transparent 25%),
        radial-gradient(circle at 85% 78%, rgba(92, 44, 20, 0.32) 0%, transparent 30%),
        linear-gradient(145deg, #475040 0%, #343b2f 55%, #292f25 100%);
      border: 4px solid #262925;
      border-radius: 10px;
      box-shadow: 
        0 16px 36px rgba(0, 0, 0, 0.85),
        inset 0 0 0 2px #586151,
        inset 0 0 28px rgba(0, 0, 0, 0.65);
      padding: 28px 24px;
      position: relative;
    }

    .top-rivet-bar {
      display: table;
      width: 100%;
      margin-bottom: 18px;
    }

    .rivet-cell {
      display: table-cell;
      vertical-align: middle;
    }

    .rivet {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #8a8f88, #3b3e3a 70%, #1c1e1c 100%);
      border: 1px solid #1a1c1a;
      box-shadow: 0 2px 3px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.25);
    }

    .metal-nameplate {
      background: linear-gradient(180deg, #525752 0%, #3a3e3a 50%, #2d302d 100%);
      border: 2px solid #1f211f;
      border-radius: 4px;
      box-shadow: 
        0 4px 10px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 0 12px rgba(98, 48, 22, 0.25);
      padding: 12px 18px;
      text-align: center;
      margin: 0 auto 24px auto;
      max-width: 440px;
    }

    .plate-subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b5ad98;
      margin: 0 0 4px 0;
    }

    .plate-title {
      font-family: 'Special Elite', 'Courier Prime', monospace;
      font-size: 22px;
      letter-spacing: 2px;
      color: #efe7d1;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.9);
      margin: 0;
      text-transform: uppercase;
    }

    .lamps-row {
      text-align: center;
      margin-bottom: 22px;
    }

    .lamp {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      margin: 0 8px;
      border: 2px solid #2b2e2a;
      box-shadow: 0 2px 5px rgba(0,0,0,0.75);
    }

    .lamp-red {
      background: radial-gradient(circle at 35% 35%, #ff6b5b, #b81d13 65%, #5c0904 100%);
      box-shadow: 0 0 10px rgba(215, 38, 28, 0.7), 0 2px 4px rgba(0,0,0,0.8);
    }

    .lamp-amber {
      background: radial-gradient(circle at 35% 35%, #ffd269, #c97a16 65%, #633904 100%);
      box-shadow: 0 0 10px rgba(235, 152, 32, 0.7), 0 2px 4px rgba(0,0,0,0.8);
    }

    .lamp-green {
      background: radial-gradient(circle at 35% 35%, #7ce879, #248a21 65%, #0d400c 100%);
      box-shadow: 0 0 10px rgba(52, 185, 48, 0.7), 0 2px 4px rgba(0,0,0,0.8);
    }

    .dispatch-paper {
      background-color: #dfd6be;
      background-image: 
        radial-gradient(circle at 90% 12%, rgba(135, 112, 74, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 12% 88%, rgba(120, 98, 62, 0.2) 0%, transparent 40%);
      color: #23211c;
      border: 2px solid #2a2c27;
      border-radius: 4px;
      padding: 24px 22px;
      box-shadow: 
        0 6px 16px rgba(0, 0, 0, 0.6),
        inset 0 0 18px rgba(105, 86, 54, 0.35);
      position: relative;
    }

    .stamp-classified {
      display: inline-block;
      border: 2px solid #8f1d1d;
      color: #8f1d1d;
      font-family: 'Special Elite', 'Courier Prime', monospace;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      padding: 3px 10px;
      text-transform: uppercase;
      transform: rotate(-2deg);
      margin-bottom: 14px;
      opacity: 0.88;
    }

    .dispatch-text {
      font-family: 'Special Elite', 'Courier Prime', monospace;
      font-size: 15px;
      line-height: 1.6;
      color: #24211b;
      margin: 0 0 18px 0;
    }

    .rotor-box {
      background: linear-gradient(180deg, #1b1d1b 0%, #2a2d29 50%, #181a18 100%);
      border: 3px solid #484d46;
      border-radius: 6px;
      padding: 18px 12px;
      text-align: center;
      margin: 20px 0;
      box-shadow: 
        inset 0 4px 12px rgba(0, 0, 0, 0.9),
        0 3px 6px rgba(0, 0, 0, 0.4);
    }

    .rotor-label {
      display: block;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: #9ba396;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .code-digits {
      display: inline-block;
      max-width: 100%;
      box-sizing: border-box;
      background-color: #101210;
      border: 2px solid #635b49;
      border-radius: 4px;
      padding: 10px 22px;
      font-family: 'Special Elite', 'Courier Prime', monospace;
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 10px;
      color: #f4ebd2;
      text-shadow: 0 0 8px rgba(244, 235, 210, 0.35);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.95);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    @media (max-width: 480px) {
      .code-digits {
        padding: 10px 12px;
        font-size: 24px;
        letter-spacing: 4px;
      }
    }

    .expiry-notice {
      font-size: 13px;
      color: #4a4335;
      border-top: 1px dashed #8c7f67;
      padding-top: 14px;
      margin-top: 16px;
      line-height: 1.5;
    }

    .footer-plate {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #9da696;
      text-transform: uppercase;
    }

    .footer-plate span {
      color: #c9bfa6;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="enigma-chassis">
      
      <div class="top-rivet-bar">
        <div class="rivet-cell" style="text-align: left;"><span class="rivet"></span></div>
        <div class="rivet-cell" style="text-align: center;"><span class="rivet"></span></div>
        <div class="rivet-cell" style="text-align: right;"><span class="rivet"></span></div>
      </div>

      <div class="metal-nameplate">
        <p class="plate-subtitle">Cryptography Unit • Secure Channel</p>
        <h1 class="plate-title">Deciphering Machine</h1>
      </div>

      <div class="lamps-row">
        <span class="lamp lamp-red" title="Security Alert"></span>
        <span class="lamp lamp-amber" title="Transmission in Progress"></span>
        <span class="lamp lamp-green" title="Cipher Generated"></span>
      </div>

      <div class="dispatch-paper">
        <div class="stamp-classified">{{STAMP}}</div>
        
        <p class="dispatch-text">{{INTRO_TEXT}}</p>

        <div class="rotor-box">
          <span class="rotor-label">{{ROTOR_LABEL}}</span>
          <div class="code-digits">{{ROTOR_VALUE}}</div>
        </div>

        <p class="dispatch-text" style="margin-bottom: 0;">{{OUTRO_TEXT}}</p>

        <div class="expiry-notice">
          TRANSMISSION REF.: <strong>#DEC-MAC-1942-X9</strong> &nbsp;|&nbsp; RECIPIENT: <strong>{{RECIPIENT_EMAIL}}</strong>
        </div>
      </div>

      <div class="footer-plate">
        <span>Central Intelligence Command</span> • Automated Dispatch
      </div>

      <div class="top-rivet-bar" style="margin-top: 18px; margin-bottom: 0;">
        <div class="rivet-cell" style="text-align: left;"><span class="rivet"></span></div>
        <div class="rivet-cell" style="text-align: center;"><span class="rivet"></span></div>
        <div class="rivet-cell" style="text-align: right;"><span class="rivet"></span></div>
      </div>

    </div>
  </div>
</body>
</html>
